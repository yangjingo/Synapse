<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title description">
  <title id="title">Synapse logic forge</title>
  <desc id="description">A hand-drawn forge turns three raw inputs into a connected argument spine.</desc>
  <g fill="none" stroke="#2c2925" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Inputs converge on the forge. -->
    <circle cx="22" cy="88" r="6" fill="#aab3a2" />
    <circle cx="22" cy="128" r="6" fill="#d8cec0" />
    <circle cx="22" cy="168" r="6" fill="#c45a20" stroke="#c45a20" />
    <path d="M28 88 C48 88 57 101 74 111" />
    <path d="M28 128 H72" />
    <path d="M28 168 C48 168 57 155 74 145" />

    <!-- Compact furnace body, derived from the README's central logic forge. -->
    <path d="M83 73 Q80 73 80 80 V188 Q80 194 87 194 H169 Q176 194 176 187 V80 Q176 73 169 73 Z" fill="#faf7f0" />
    <path d="M86 76 Q83 76 83 82 V185 Q83 191 89 191 H166" stroke="#8c857b" stroke-width="2.5" opacity=".8" />
    <path d="M108 73 V51 H148 V73" fill="#d8cec0" />
    <path d="M114 51 V41 H142 V51" />
    <path d="M118 36 C112 29 119 24 124 18" stroke="#8c857b" stroke-width="3" />
    <path d="M136 36 C143 28 135 23 132 17" stroke="#8c857b" stroke-width="3" />
    <circle cx="128" cy="94" r="11" fill="#d8cec0" />
    <path d="M128 94 L134 89" stroke="#c45a20" stroke-width="3" />

    <!-- The orange chamber is the single visual focus. -->
    <rect x="94" y="112" width="68" height="57" rx="8" fill="#f7e5d8" stroke="#c45a20" />
    <path d="M116 158 C102 143 116 135 121 123 C125 134 132 137 130 147 C136 142 140 136 139 130 C153 145 147 160 134 164 C127 167 120 164 116 158 Z" fill="#c45a20" stroke="#c45a20" />
    <path d="M124 157 C119 150 126 146 129 139 C136 148 135 156 130 160" fill="#faf7f0" stroke="#faf7f0" stroke-width="3" />
    <path d="M99 181 H111 M122 181 H134 M145 181 H157" stroke="#8c857b" stroke-width="3" />

    <!-- One argument spine leaves the forge. -->
    <path d="M176 128 H232" />
    <circle cx="192" cy="128" r="7" fill="#faf7f0" />
    <circle cx="216" cy="128" r="7" fill="#f7e5d8" stroke="#c45a20" />
    <circle cx="240" cy="128" r="7" fill="#c45a20" stroke="#c45a20" />
    <path d="M192 106 V150 M216 102 V154 M240 106 V150" stroke="#8c857b" stroke-width="2.5" />
  </g>
</svg>
