<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
<title id="title">Reward gain versus KL budget</title>
<desc id="description">An illustrative frontier places RL, OPD, and SFT at different KL budgets. A dotted guide relates the OPD point to a schematic lower-reward point at the same budget.</desc>
<defs>
<marker id="warm-arrow" markerWidth="19" markerHeight="18" refX="17" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L17 9 L2 16" fill="none" stroke="#99998F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="accent-arrow" markerWidth="19" markerHeight="18" refX="17" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L17 9 L2 16" fill="none" stroke="#62756A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="1200" height="675" fill="#EEEDE4" stroke="none" stroke-width="2" rx="0"/>
<rect x="48" y="48" width="1104" height="579" fill="#F9F8F3" stroke="none" stroke-width="2" rx="20"/>
<polyline points="114,525 1070,525" fill="none" stroke="#99998F" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#warm-arrow)"/>
<polyline points="114,525 114,128" fill="none" stroke="#99998F" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#warm-arrow)"/>
<text x="114" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" fill="#41413B" text-anchor="start">Reward gain ΔR</text>
<text x="1068" y="564" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" fill="#41413B" text-anchor="end">KL budget β</text>
<path d="M128 480 C170 397 221 355 273 322 S405 250 492 224 S776 185 945 179 S1014 174 1050 172" fill="none" stroke="#62756A" stroke-width="4.5" stroke-linecap="round"/>
<line x1="492" y1="235" x2="492" y2="380" stroke="#99998F" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 6"/>
<circle cx="273" cy="322" r="9" fill="#62756A" stroke="none" stroke-width="2"/>
<text x="260" y="303" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600" fill="#41413B" text-anchor="end">RL</text>
<circle cx="492" cy="224" r="9" fill="#62756A" stroke="none" stroke-width="2"/>
<text x="504" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600" fill="#41413B" text-anchor="start">OPD</text>
<circle cx="945" cy="179" r="9" fill="#62756A" stroke="none" stroke-width="2"/>
<text x="957" y="151" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600" fill="#41413B" text-anchor="start">SFT</text>
<circle cx="492" cy="389" r="9" fill="#F9F8F3" stroke="#99998F" stroke-width="2"/>
<text x="517" y="397" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#41413B" text-anchor="start">OPSD / SDFT</text>
</svg>
