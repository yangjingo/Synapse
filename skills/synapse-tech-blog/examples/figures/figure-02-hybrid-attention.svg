<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
<title id="title">Hybrid attention within a CSA or HCA layer</title>
<desc id="description">CSA selects top-k compressed KV entries. HCA attends densely over more heavily compressed KV. Each layer brings its own uncompressed sliding-window KV into attention.</desc>
<defs>
<marker id="warm-arrow" markerWidth="19" markerHeight="18" refX="17" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L17 9 L2 16" fill="none" stroke="#99998F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="accent-arrow" markerWidth="19" markerHeight="18" refX="17" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L17 9 L2 16" fill="none" stroke="#62756A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="1200" height="675" fill="#EEEDE4" stroke="none" stroke-width="2" rx="0"/>
<rect x="48" y="48" width="1104" height="579" fill="#F9F8F3" stroke="none" stroke-width="2" rx="20"/>
<rect x="76" y="93" width="1048" height="221" fill="#EDEDE4" stroke="none" stroke-width="2" rx="12"/>
<text x="102" y="135" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#41413B" text-anchor="start">CSA</text>
<rect x="178" y="156" width="243" height="60" fill="#F9F8F3" stroke="#99998F" stroke-width="2" rx="12"/>
<text x="299.5" y="195" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" fill="#41413B" text-anchor="middle">4:1 compression</text>
<rect x="511" y="156" width="250" height="60" fill="#F9F8F3" stroke="#99998F" stroke-width="2" rx="12"/>
<text x="636" y="195" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" fill="#41413B" text-anchor="middle">Top-k compressed KV</text>
<rect x="511" y="237" width="250" height="60" fill="#F9F8F3" stroke="#99998F" stroke-width="2" rx="12"/>
<text x="636" y="276" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" fill="#41413B" text-anchor="middle">Local KV</text>
<rect x="890" y="196" width="195" height="60" fill="#DBD9CF" stroke="#99998F" stroke-width="2" rx="12"/>
<text x="987.5" y="235" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" fill="#41413B" text-anchor="middle">Attention</text>
<polyline points="421,186 511,186" fill="none" stroke="#99998F" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#warm-arrow)"/>
<polyline points="761,186 824,186 824,213 890,213" fill="none" stroke="#99998F" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#warm-arrow)"/>
<polyline points="761,267 824,267 824,239 890,239" fill="none" stroke="#99998F" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#warm-arrow)"/>
<rect x="76" y="348" width="1048" height="221" fill="#EDEDE4" stroke="none" stroke-width="2" rx="12"/>
<text x="102" y="390" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#41413B" text-anchor="start">HCA</text>
<rect x="178" y="411" width="243" height="60" fill="#F9F8F3" stroke="#99998F" stroke-width="2" rx="12"/>
<text x="299.5" y="450" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" fill="#41413B" text-anchor="middle">128:1 compression</text>
<rect x="511" y="411" width="250" height="60" fill="#F9F8F3" stroke="#99998F" stroke-width="2" rx="12"/>
<text x="636" y="450" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" fill="#41413B" text-anchor="middle">All compressed KV</text>
<rect x="511" y="492" width="250" height="60" fill="#F9F8F3" stroke="#99998F" stroke-width="2" rx="12"/>
<text x="636" y="531" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" fill="#41413B" text-anchor="middle">Local KV</text>
<rect x="890" y="451" width="195" height="60" fill="#DBD9CF" stroke="#99998F" stroke-width="2" rx="12"/>
<text x="987.5" y="490" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" fill="#41413B" text-anchor="middle">Attention</text>
<polyline points="421,441 511,441" fill="none" stroke="#99998F" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#warm-arrow)"/>
