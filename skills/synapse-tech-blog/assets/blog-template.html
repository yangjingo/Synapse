</style></head><body id="top"><div class="topbar"><button type="button" id="mobile-toc">目录</button><button type="button" id="mobile-comments">Comments</button></div><button type="button" class="toc-open" id="show-toc">展开目录</button><div class="masthead"><a class="brand" href="#top">WhyJ / Engineering</a><span class="edition">INFERENCE SYSTEMS · 2026.11</span></div><header class="hero"><h1>{{ARTICLE_TITLE}}</h1><p class="lead">{{ARTICLE_SUBTITLE}}</p><div class="meta">{{ARTICLE_META}}</div></header><button type="button" class="comments-orb" id="show-comments" aria-label="展开 Comments" aria-expanded="false" title="Comments"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5h14v10H11l-4.5 3v-3H5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></button><div class="workspace comments-hidden" id="workspace"><nav class="side toc" id="toc" aria-label="文章目录"><div class="side-heading"><span>ON THIS PAGE</span><button type="button" id="hide-toc" aria-label="收起目录" title="收起目录">‹</button></div><ol class="toc-list" id="toc-list"></ol></nav><main id="article">

<section><h2>文章标题</h2><p>在此撰写正文。</p></section>
</main><aside class="side comments" id="discussion" aria-label="Comments"><div class="comments-content"><div class="side-heading"><span>COMMENTS</span><button type="button" id="hide-comments" aria-label="收起 Comments" title="收起 Comments">›</button></div><div id="comment-list" class="comment-list"></div><label class="visually-hidden" for="comment-input">添加一条评论</label><textarea id="comment-input" class="comment-input" rows="2" placeholder="写下一个问题或想法…"></textarea><div class="comment-toolbar"><span class="hint">Ctrl / ⌘ + Enter 添加</span><button type="button" id="add-comment">添加</button></div><p id="notes-status" class="hint" role="status" aria-live="polite">自动保存在当前浏览器</p><div class="faq-actions"><button type="button" id="copy-notes">复制全部记录</button></div></div></aside></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),article=$('article'),toc=$('toc'),panel=$('discussion'),workspace=$('workspace');const headings=[...article.querySelectorAll('h2')];headings.forEach((h,i)=>{h.id=h.id||'section-'+(i+1);const a=document.createElement('a');a.href='#'+h.id;a.textContent=h.textContent;const li=document.createElement('li');li.append(a);$('toc-list').append(li)});$('hide-toc').onclick=()=>{workspace.classList.add('collapsed');document.body.classList.add('toc-hidden');toc.classList.remove('mobile-open')};$('show-toc').onclick=()=>{workspace.classList.remove('collapsed');document.body.classList.remove('toc-hidden')};function toggle(el){const open=!el.classList.contains('mobile-open');toc.classList.remove('mobile-open');panel.classList.remove('mobile-open');if(open)el.classList.add('mobile-open')}$('mobile-toc').onclick=()=>toggle(toc);$('mobile-comments').onclick=()=>toggle(panel);$('show-comments').onclick=()=>{workspace.classList.remove('comments-hidden');document.body.classList.add('comments-visible');if(window.matchMedia('(max-width: 1100px)').matches){toc.classList.remove('mobile-open');panel.classList.add('mobile-open')}$('show-comments').setAttribute('aria-expanded','true')};$('hide-comments').onclick=()=>{workspace.classList.add('comments-hidden');document.body.classList.remove('comments-visible');panel.classList.remove('mobile-open');$('show-comments').setAttribute('aria-expanded','false')};$('toc-list').onclick=e=>{if(e.target.tagName==='A')toc.classList.remove('mobile-open')};if('IntersectionObserver'in window){const obs=new IntersectionObserver(entries=>{for(const e of entries){if(e.isIntersecting){for(const a of $('toc-list').querySelectorAll('a'))a.classList.toggle('active',a.hash==='#'+e.target.id)}}},{rootMargin:'-10% 0px -75% 0px'});headings.forEach(h=>obs.observe(h))}
const key='whyj-blog-comments:'+encodeURIComponent(location.pathname),list=$('comment-list'),input=$('comment-input'),status=$('notes-status');let entries=[],editing=null;function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}function save(next){try{localStorage.setItem(key,JSON.stringify(next));entries=next;status.textContent='已保存在当前浏览器';return true}catch(e){status.textContent='保存失败，请及时复制记录。';return false}}try{const data=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(data))entries=data.filter(x=>x&&typeof x.text==='string')}catch(e){status.textContent='浏览器存储不可用，请检查设置。'}
function render(){list.replaceChildren();if(!entries.length){const p=document.createElement('p');p.className='empty-comments';p.textContent='还没有记录。';list.append(p);return}entries.forEach(entry=>{const row=document.createElement('div');row.className='comment-row';const text=document.createElement('p');text.textContent=entry.text;const actions=document.createElement('div');actions.className='comment-actions';const edit=document.createElement('button');edit.type='button';edit.textContent='编辑';edit.onclick=()=>{editing=entry.id;input.value=entry.text;$('add-comment').textContent='保存';input.focus()};const del=document.createElement('button');del.type='button';del.textContent='删除';del.onclick=()=>{if(!confirm('删除这条记录？'))return;if(save(entries.filter(x=>x.id!==entry.id))){if(editing===entry.id)reset();render()}};actions.append(edit,del);row.append(text,actions);list.append(row)})}function reset(){editing=null;input.value='';$('add-comment').textContent='添加'}function submit(){const text=input.value.trim();if(!text){status.textContent='请先写下内容。';input.focus();return}const next=editing?entries.map(x=>x.id===editing?{...x,text}:x):[...entries,{id:id(),text}];if(save(next)){reset();render();input.focus()}}$('add-comment').onclick=submit;input.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();submit()}if(e.key==='Escape'&&editing){reset();status.textContent='已取消编辑'}});$('copy-notes').onclick=async()=>{const value=entries.map((x,i)=>`${i+1}. ${x.text}`).join('\n\n');if(!value){status.textContent='还没有记录。';return}try{await navigator.clipboard.writeText(value);status.textContent='全部记录已复制。'}catch(e){const temp=document.createElement('textarea');temp.value=value;temp.style.position='fixed';temp.style.left='-9999px';document.body.append(temp);temp.select();try{if(!document.execCommand('copy'))throw Error();status.textContent='全部记录已复制。'}catch(err){status.textContent='自动复制不可用，请逐条选择复制。'}temp.remove()}};render()})();
</script></body></html>
