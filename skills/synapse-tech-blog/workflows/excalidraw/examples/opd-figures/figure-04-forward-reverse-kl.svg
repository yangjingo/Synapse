<text x="600" y="52" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="28" fill="#4A4338" text-anchor="middle">Forward KL vs. Reverse KL</text>
<text x="290" y="130" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="20" fill="#4A4338" text-anchor="middle">Forward KL · off-policy</text>
<text x="290" y="211" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="15" fill="#4A4338" text-anchor="middle">Teacher response</text>
<text x="290" y="325" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="15" fill="#4A4338" text-anchor="middle">Fixed dataset</text>
<text x="290" y="439" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="15" fill="#4A4338" text-anchor="middle">Student imitates</text>
<text x="910" y="130" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="20" fill="#4A4338" text-anchor="middle">Reverse KL · on-policy</text>
<text x="910" y="211" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="15" fill="#4A4338" text-anchor="middle">Student rollout</text>
<text x="910" y="325" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="15" fill="#4A4338" text-anchor="middle">Teacher scores tokens</text>
<text x="910" y="439" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="15" fill="#4A4338" text-anchor="middle">Student updates</text>
<text x="290" y="639" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="15" fill="#4A4338" text-anchor="middle">Sparse supervision</text>
<text x="290" y="658.5" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="15" fill="#4A4338" text-anchor="middle">Teacher distribution</text>
<text x="910" y="639" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="15" fill="#4A4338" text-anchor="middle">Dense supervision</text>
<text x="910" y="658.5" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="15" fill="#4A4338" text-anchor="middle">Student distribution</text>
<text x="600" y="810" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="16" fill="#4A4338" text-anchor="middle">The direction changes who generates the trajectory—and how</text>
<text x="600" y="830.8" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="16" fill="#4A4338" text-anchor="middle">dense the signal becomes</text>

