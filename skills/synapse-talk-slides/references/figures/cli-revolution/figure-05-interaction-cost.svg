<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
  <title id="title">Interaction cost collapses</title>
  <desc id="desc">Fewer state transitions bring execution closer to intent</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#C45A20"/></marker>
  </defs>
  <rect width="760" height="460" fill="#FAFAF7"/>
  <text x="42" y="47" text-anchor="start" font-family="Arial, sans-serif" font-size="26" font-weight="750" fill="#4A4338">Interaction cost collapses</text>
  <text x="42" y="75" text-anchor="start" font-family="Arial, sans-serif" font-size="15" font-weight="500" fill="#908878">Fewer state transitions bring execution closer to intent</text>
  <path d="M42 91 C180 88, 310 94, 452 90" fill="none" stroke="#C45A20" stroke-width="3"/>
  <rect x="100" y="130" width="465" height="62" rx="16" fill="#E8E2D8" stroke="#4A4338" stroke-width="2.5"/><text x="332.5" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="650" fill="#4A4338">GUI</text><text x="332.5" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#908878">5 stateful steps</text><rect x="100" y="225" width="310" height="62" rx="16" fill="#DCE5EA" stroke="#4A4338" stroke-width="2.5"/><text x="255" y="253" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="650" fill="#4A4338">Tool call</text><text x="255" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#908878">3 structured steps</text><rect x="100" y="320" width="155" height="62" rx="16" fill="#FDF0E6" stroke="#C45A20" stroke-width="2.5"/><text x="177.5" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="650" fill="#4A4338">CLI</text><text x="177.5" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#908878">1 command</text><path d="M 610 150 L 610 355" fill="none" stroke="#C45A20" stroke-width="3" marker-end="url(#arrow)"/><text x="610" y="242.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#C45A20">O(n) → O(1)</text>
</svg>