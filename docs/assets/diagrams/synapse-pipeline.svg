<text x="600" y="102" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="30" fill="#4A4338" text-anchor="middle">SYNAPSE · THE HIGH-PRESSURE LOGIC FORGE</text>
<text x="600" y="144" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="18" fill="#908878" text-anchor="middle">Turn noisy source material into an argument people can see.</text>
<text x="153" y="299" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="15" fill="#4A4338" text-anchor="middle">01 · INPUT</text>
<text x="153" y="318.5" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="15" fill="#4A4338" text-anchor="middle">URLs · files · notes</text>
<text x="377" y="299" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="15" fill="#4A4338" text-anchor="middle">02 · FORGE</text>
<text x="377" y="318.5" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="15" fill="#4A4338" text-anchor="middle">extract · verify · synthesize</text>
<text x="601" y="299" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="15" fill="#4A4338" text-anchor="middle">03 · DSL</text>
<text x="601" y="318.5" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="15" fill="#4A4338" text-anchor="middle">argument spine</text>
<text x="825" y="299" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="15" fill="#4A4338" text-anchor="middle">04 · COMPOSE</text>
<text x="825" y="318.5" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="15" fill="#4A4338" text-anchor="middle">design · type · diagrams</text>
<text x="1049" y="299" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="15" fill="#4A4338" text-anchor="middle">05 · PUBLISH</text>
<text x="1049" y="318.5" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="15" fill="#4A4338" text-anchor="middle">slides · blog · motion</text>
<text x="220" y="504" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="15" fill="#4A4338" text-anchor="middle">TRACEABLE INPUT</text>
<text x="220" y="523.5" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="15" fill="#4A4338" text-anchor="middle">Keep claims, evidence, and local assets</text>
<text x="220" y="543" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="15" fill="#4A4338" text-anchor="middle">connected to their sources.</text>
<text x="600" y="504" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="15" fill="#4A4338" text-anchor="middle">ONE LOGIC CORE</text>
<text x="600" y="523.5" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="15" fill="#4A4338" text-anchor="middle">The same DSL drives slides, articles,</text>
<text x="600" y="543" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="15" fill="#4A4338" text-anchor="middle">diagrams, and animation.</text>
<text x="980" y="504" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="15" fill="#4A4338" text-anchor="middle">FINISHED VISUALS</text>
<text x="980" y="523.5" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="15" fill="#4A4338" text-anchor="middle">Ship real embedded assets—not prompts</text>
<text x="980" y="543" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="15" fill="#4A4338" text-anchor="middle">pretending to be pictures.</text>
<text x="600" y="748" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="17" fill="#4A4338" text-anchor="middle">THE PAYOFF  ·  Less formatting drift. More reasoning density. One reproducible pipeline.</text>
<text x="600" y="839" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="14" fill="#908878" text-anchor="middle">Why.J Engineering · v2.0.0 · Editable Excalidraw source included</text>

