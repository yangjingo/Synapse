<text x="925" y="158.5" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="15" fill="#4A4338" text-anchor="middle">Agent orchestration</text>
<text x="600" y="311" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="17" fill="#4A4338" text-anchor="middle">pi Agent · Single control loop</text>
<text x="315" y="489" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="15" fill="#4A4338" text-anchor="middle">MCP Data Tools · 7</text>
