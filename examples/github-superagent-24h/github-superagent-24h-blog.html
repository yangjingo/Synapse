<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>电脑关机后，Agent 仍能沿着看板交付</title>
  <style>
    :root {
      --bg: #FAFAF7;
      --ink: #1A1A1A;
      --muted: #8A7F70;
      --accent: #C45A20;
      --accent-light: #FDF0E6;
      --border: #E8E2D8;
      --section-rule-space: 40px;
      --serif: 'Noto Serif SC', 'Songti SC', 'SimSun', Georgia, serif;
      --sans: 'Inter', 'Microsoft YaHei', 'Segoe UI', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--bg); color: var(--ink); }
    body { min-height: 100vh; padding-bottom: 48px; }

    .page { max-width: 700px; margin: 0 auto; padding: 72px 24px 0; }


    .article-header, .article-body { min-width: 0; }
    .article-toc {
      --toc-ink: #635749;
      --toc-active: #843C18;
      color: var(--toc-ink);
      font: 400 13px/1.45 var(--sans);
    }
    .toc-heading {
      padding: 0 12px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--ink);
      font: 700 20px/1.25 var(--serif);
    }
    .toc-toggle { display: none; }
    .toc-list {
      list-style: none;
      padding: 7px 3px 5px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
      overscroll-behavior-y: contain;
    }
    .toc-list li + li { margin-top: 2px; }
    .toc-list li.toc-break {
      border-top: 1px solid var(--border);
      margin-top: 10px;
      padding-top: 9px;
    }
    .toc-list a {
      position: relative;
      display: block;
      padding: 8px 10px 8px 13px;
      border-radius: 0 3px 3px 0;
      color: inherit;
      overflow-wrap: anywhere;
      text-decoration: none;
    }
    .toc-list a:hover { background: #F3EFE8; color: var(--ink); }
    .toc-list a[aria-current='location'] {
      background: var(--accent-light);
      color: var(--toc-active);
      font-weight: 650;
    }
    .toc-list a[aria-current='location']::before {
      position: absolute;
      inset: 0 auto 0 0;
      width: 2px;
      background: var(--accent);
      content: '';
    }
    .toc-list a:focus-visible, .toc-toggle:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }
    #sections-wrap > .section[id] { scroll-margin-top: 30px; }

    @media (min-width: 1100px) {
      .page {
        display: grid;
        max-width: none;
        grid-template-columns: minmax(0, 1fr) minmax(0, 652px) minmax(0, 1fr);
        grid-template-rows: auto 1fr;
      }
      .article-header { grid-area: 1 / 2; }
      .article-body { grid-area: 2 / 2; }
      .article-toc {
        grid-area: 2 / 1;
        position: sticky;
        top: 32px;
        align-self: start;
        justify-self: end;
        width: min(220px, calc(100% - 28px));
        margin-top: var(--section-rule-space);
        margin-right: 28px;
        border-top: 1px solid var(--border);
      }
      .toc-heading { padding: 12px 12px 7px; border-bottom: 0; }
      .toc-list { max-height: calc(100vh - 110px); }
    }
    @media (max-width: 1099px) {
      .article-toc {
        position: sticky;
        top: 0;
        z-index: 3;
        margin-top: 23px;
        border-block: 1px solid var(--border);
        background: var(--bg);
      }
      .toc-heading { display: none; }
      .toc-toggle {
        display: flex;
        width: 100%;
        min-height: 45px;
        gap: 12px;
        align-items: center;
        padding: 0 12px;
        border: 0;
        background: transparent;
        color: var(--ink);
        font: 700 15px/1.3 var(--serif);
        text-align: left;
        cursor: pointer;
      }
      .toc-toggle::after {
        flex: 0 0 auto;
        width: 7px;
        height: 7px;
        margin: -4px 2px 0 auto;
        border: solid currentColor;
        border-width: 0 1.5px 1.5px 0;
        transform: rotate(45deg);
        content: '';
      }
      .toc-toggle[aria-expanded='true']::after { margin-top: 3px; transform: rotate(225deg); }
      .toc-preview {
        overflow: hidden;
        color: var(--toc-ink);
        font: 400 12px/1.35 var(--sans);
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .toc-toggle[aria-expanded='false'] + .toc-list { display: none; }
      .toc-list { max-height: min(52vh, 403px); border-top: 1px solid var(--border); }
      .toc-list a { display: flex; min-height: 44px; align-items: center; }
      #sections-wrap > .section[id] { scroll-margin-top: 66px; }
    }

    .title-line {
      font-family: var(--serif);
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.03em;
    }
    .lead-block {
      font-family: var(--sans);
      font-weight: 500;
      font-size: 15.5px;
      line-height: 26px;
      color: var(--muted);
      margin: 16px 0 0;
    }
    .hr { height: 1px; background: var(--border); margin: var(--section-rule-space) 0; }

    .section { margin-top: 40px; }
    .section-h {
      font: 700 15px/1.3 var(--sans);
      color: var(--accent);
      letter-spacing: -0.01em;
      margin-bottom: 12px;
    }
    .section-body {
      font: 400 17px/30px var(--serif);
      color: var(--ink);
    }
    .section-body a {
      color: var(--accent);
      text-decoration: underline;
      text-decoration-color: rgba(196,90,32,0.3);
      text-underline-offset: 2px;
      transition: text-decoration-color 0.2s;
    }
    .section-body a:hover {
      text-decoration-color: var(--accent);
    }
    .callout {
      position: relative;
      margin: 20px 0;
      padding: 16px 20px 16px 24px;
      background: var(--accent-light);
      border-radius: 4px;
      font: 500 15px/25px var(--sans);
      color: #6B3A12;
    }
    .callout::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
      background: var(--accent);
      border-radius: 4px 0 0 4px;
    }
    .figure-block {
      margin: 32px auto;
      border-radius: 6px;
      overflow: hidden;
      background: #F5F3EE;
      max-width: 100%;
    }
    .figure-block img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 70vh;
      object-fit: contain;
      object-position: center;
      background: #fff;
      cursor: zoom-in;
      transition: transform 0.3s ease;
    }
    .figure-block.zoomed {
      position: fixed;
      inset: 0;
      max-width: none;
      margin: 0;
      border-radius: 0;
      z-index: 100;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .figure-block.zoomed img {
      max-height: none;
      width: auto;
      max-width: 95vw;
      max-height: 95vh;
      cursor: zoom-out;
    }
    .figure-block.zoomed .figure-caption {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      color: #eee;
      border-radius: 4px;
      padding: 6px 14px;
    }
    .figure-caption {
      padding: 10px 16px 4px;
      font: 500 13px/20px var(--sans);
      color: var(--muted);
    }
    .figure-prompt-vis {
      padding: 4px 16px 12px;
      font: 400 11.5px/17px var(--sans);
      color: #B0A898;
      border-top: 1px solid #E8E2D8;
      margin-top: 2px;
    }
    .figure-placeholder {
      padding: 32px 20px;
      text-align: center;
      background: #EDEBE6;
    }
    .figure-placeholder-icon {
      font: 700 28px/1 var(--sans);
      color: var(--border);
      margin-bottom: 8px;
    }
    .figure-placeholder-label {
      font: 600 13px/1 var(--sans);
      color: var(--accent);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .figure-placeholder-prompt {
      font: 400 12px/18px var(--sans);
      color: var(--muted);
      max-width: 480px;
      margin: 0 auto;
      white-space: pre-wrap;
    }
    .meta-tag {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      padding: 2px 8px;
      border-radius: 3px;
      font: 700 11px/1 var(--sans);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    .meta-date {
      font: 500 13px/1 var(--sans);
      color: var(--muted);
      margin-bottom: 24px;
    }


    #reading-ripple {
      position: fixed;
      width: 92px;
      height: 92px;
      border: 2px solid var(--accent, #C45A20);
      border-radius: 50%;
      pointer-events: none;
      z-index: 50;
    }
    #reading-ripple::after {
      content: "";
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(196, 90, 32, .58);
      border-radius: 50%;
    }
    #reading-ripple[hidden] { display: none; }
  </style>
<style>
    .figure-zoom-target { cursor: zoom-in; }
    .figure-block.zoomed .figure-zoom-target { cursor: zoom-out; }
    .figure-zoom-target:focus-visible { outline: 2px solid var(--accent,#C45A20); outline-offset: -2px; }

    .figure-block[data-native].zoomed { flex-direction: column; padding: 14px; }
    .figure-block[data-native].zoomed .figure-content { width: min(92vw,980px); }
    .figure-block[data-native].zoomed .figure-caption { position: static; transform: none; margin: 6px auto 0; }
    .figure-block { background: transparent; }
    .figure-block img { background: #EEEDE4; border-radius: 6px; }
    .figure-caption { padding: 9px 0 0; font: 400 14px/1.55 var(--sans); color: #5C584F; }
    .figure-caption strong { display: block; font-weight: 600; }
    .figure-caption p { margin-top: 3px; }
    .figure-caption a { color: inherit; text-underline-offset: .17em; }
    .figure-block.zoomed { z-index: 110; overscroll-behavior: contain; }
    .figure-block.zoomed .figure-caption { width: min(92vw, 760px); }
    .figure-prompt-vis { display: none; }
    @media (max-width: 700px) {
      .figure-block.zoomed { display: block; overflow: auto; padding: 14px; }
      .figure-block.zoomed img { width: 700px; max-width: none; max-height: none; }
      .figure-block.zoomed .figure-caption {
        position: static;
        transform: none;
        width: auto;
        margin-top: 10px;
        padding: 4px 0;
      }
    }
</style>

<style>
  .title-line { display: block; }
  .lead-block { line-height: 26px; color: #5C584F; }
  .article-scope { margin-top: 12px; color: #5C584F; font: 400 14px/1.7 var(--sans); }
  .section-h { font: 700 21px/1.45 var(--serif); }
  .section-continuation { margin-top: 20px; }
  .section-body > * + * { margin-top: 13px; }
  .section-body ol, .section-body ul { padding-left: 1.5em; }
  .section-body li + li { margin-top: 12px; }
  .section-body strong { font-weight: 700; }
  .section-body pre { padding: 14px; overflow: auto; border: 1px solid var(--border); background: #F4F1EA; font: 13px/1.55 Consolas, monospace; }
  .section-body :not(pre) > code { font: .86em Consolas, monospace; overflow-wrap: anywhere; }
  .table-wrap { max-width: 100%; overflow: auto; border: 1px solid var(--border); }
  .section-body table { width: 100%; min-width: 485px; border-collapse: collapse; font: 400 14px/1.55 var(--sans); }
  .section-body th, .section-body td { padding: 9px 10px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--border); }
  .section-body th { background: #F4F1EA; font-weight: 700; }
  .section-body tr:last-child td { border-bottom: 0; }
  .section-body th:first-child { width: 25%; }
  .diagram { display: grid; align-items: stretch; gap: 7px 5px; border: 1px solid var(--border); border-radius: 4px; background: #EEEDE4; color: #41413B; padding: clamp(10px, 3.4vw, 22px); font: 600 clamp(10px, 2.25vw, 15px)/1.3 var(--sans); }
  .diagram-handoff { grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr); }
  .diagram-recovery { grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr); }
  .diagram-node { display: grid; place-items: center; min-height: 52px; border: 1px solid #99998F; border-radius: 3px; padding: 7px 3px; background: #F9F8F3; text-align: center; }
  .diagram-focus { background: #DBD9CF; }
  .diagram-arrow { display: grid; place-items: center; color: #625C50; padding: 0 2px; }
  .diagram-return { grid-column: 3 / -1; margin-top: 4px; border-bottom: 1px dashed #99998F; border-left: 1px dashed #99998F; padding: 5px 7px; color: #625C50; text-align: center; }
  @media (max-width: 480px) {
    .page { padding-top: 38px; }
    .section-h { font-size: 19px; }
    .section-body { font-size: 16px; line-height: 1.75; }
    .section { margin-top: 32px; }
    .diagram { column-gap: 2px; }
    .diagram-arrow { padding: 0; }
  }
</style>

</head>
<body>
<span id="reading-ripple" aria-hidden="true" hidden></span>
<div class="page">
  <header class="article-header">
    <div class="meta-date" id="article-meta"></div>

    <!-- ① pretext 自适应标题 -->
    <h1 id="title-wrap" aria-label="电脑关机后，Agent 仍能沿着看板交付"></h1>

    <!-- ② pretext 测量 lead，CSS 正常渲染 -->
    <div id="lead-wrap"></div>

    <p class="article-scope">我把这个设想称为 24 小时 SuperAgent。GitHub 看板保存需求和验收条件，云端 Worker 按任务记录接力，PR 和 Actions 保存可复查的交付证据。本文从 WhyJ-Quant 已有的看板与 CI 出发，设计云端接力、故障恢复和关机验收。这三项还待部署验证。</p>
  </header>
  <nav class="article-toc" aria-label="目录" hidden>
    <div class="toc-heading" aria-hidden="true">目录</div>
    <button type="button" class="toc-toggle" aria-controls="article-toc-list" aria-expanded="false">
      <span class="toc-toggle-label">目录</span><span class="toc-preview" aria-hidden="true"></span>
    </button>
    <ol class="toc-list" id="article-toc-list"></ol>
  </nav>
  <div class="article-body">
    <div class="hr"></div>

    <!-- ③ 正文（pretext 测量高度，CSS 正常渲染） -->
    <main id="sections-wrap"></main>
  </div>

</div>

    "heading": "Synapse 把完成后的证据写成团队能复用的材料",
    "body": "CI-02 验收后，另一位同事可能想知道，为什么要从安装产物重放行情，以及这条检查覆盖了源码入口测试漏掉的什么。看板上的「已完成」只能告诉他团队做完了这项工作。 把需求、验证断言和运行结果一起写进技术解释，下一位同事才能沿着文章复跑这条检查。 把需求卡、最终 PR、Actions 运行和失败日志交给 Synapse 的 Forge 流程 ，就有材料解释这条测试为什么值得补。团队可用 Synapse 的博客和幻灯片技能 分别写技术解释和复盘短讲，两份材料沿用同一组证据。 Worker 可以从对应提交读取 WhyJ-Quant 的 issue-skill 界定任务范围，再按 pr-skill 核对交付。成文时保留回到原需求和原运行的入口。等另一位同事能沿着文章找到断言、复跑测试，并用在自己的安装场景里，团队才知道这份记录能被复用。",
    "bodyHTML": "\u003cp>CI-02 验收后，另一位同事可能想知道，为什么要从安装产物重放行情，以及这条检查覆盖了源码入口测试漏掉的什么。看板上的「已完成」只能告诉他团队做完了这项工作。\u003c/p>\n\u003cp>\u003cstrong>把需求、验证断言和运行结果一起写进技术解释，下一位同事才能沿着文章复跑这条检查。\u003c/strong>\u003c/p>\n\u003cp>把需求卡、最终 PR、Actions 运行和失败日志交给 \u003ca href=\"https://github.com/yangjingo/Synapse/blob/0eda5e6789f8393acf3f818e8d9f85fdf315c451/skills/synapse-tech-blog/workflows/forge/WORKFLOW.md\" rel=\"noopener noreferrer\" target=\"_blank\">Synapse 的 Forge 流程\u003c/a>，就有材料解释这条测试为什么值得补。团队可用 \u003ca href=\"https://github.com/yangjingo/Synapse/tree/0eda5e6789f8393acf3f818e8d9f85fdf315c451/skills\" rel=\"noopener noreferrer\" target=\"_blank\">Synapse 的博客和幻灯片技能\u003c/a>分别写技术解释和复盘短讲，两份材料沿用同一组证据。\u003c/p>\n\u003cp>Worker 可以从对应提交读取 \u003ca href=\"https://github.com/yangjingo/WhyJ-Quant/blob/08f860beeb8d3a3b9bf0eae15b7c9ebcde75fdb5/.agents/skills/issue-skill/SKILL.md\" rel=\"noopener noreferrer\" target=\"_blank\">WhyJ-Quant 的 issue-skill\u003c/a>界定任务范围，再按 \u003ca href=\"https://github.com/yangjingo/WhyJ-Quant/blob/08f860beeb8d3a3b9bf0eae15b7c9ebcde75fdb5/.agents/skills/pr-skill/SKILL.md\" rel=\"noopener noreferrer\" target=\"_blank\">pr-skill\u003c/a>核对交付。成文时保留回到原需求和原运行的入口。等另一位同事能沿着文章找到断言、复跑测试，并用在自己的安装场景里，团队才知道这份记录能被复用。\u003c/p>\n"
  },
  {
    "id": "entrypoints",
    "tocLabel": "附录 A · 项目委派入口",
    "tocBreak": true,
    "heading": "附录 A · GitHub、Linear 和 Jira 的委派入口",
    "body": "如果团队已经在 Linear 或 Jira 规划工作，CI-02 的状态就可能同时出现在原任务和 GitHub 看板，接手者需要知道该更新哪一边。 让团队已有的任务系统负责状态更新，用 GitHub PR 和 Actions 保存可回查的代码与验证证据。 对 WhyJ-Quant，GitHub Projects 加仓库 Issues 已经能关联需求、PR 和项目字段。使用 Linear 或 Jira 的团队可以继续沿用所在系统的委派入口和更新权限。 入口 适合怎样交办 Agent 怎样接手 GitHub Projects + Issues 维护者从看板选工作，把卡片或 Issue 链接交给 Agent。 Agent 通过 CLI 或 API 回填。具备权限时，维护者可以 将仓库 Issue 指派给 GitHub Copilot ，由它提交 PR 供评审。 Linear + GitHub 负责人通过委派或 @ 提及发起工作。 现有 Agent 可以用 Linear MCP 读写卡片。原生委派通过 AgentSession 与 Activity 接收任务、报告进展，再通过 Linear 的 GitHub 集成 关联 PR 和 Issue。 Jira + GitHub 团队已经在 Jira 管理需求与跨团队依赖。 团队可以 从 Jira 工作项启动编码 Agent ，让它提交 Draft PR 供评审。 Linear 的 Agent 委派设计 区分人的 assignee 和 Agent 的 delegate。我会把这个责任边界沿用到 GitHub。维护者继续负责需求与验收，Worker 会话负责推进当前尝试。会话结束或重试后，负责人与待验收内容还留在需求卡上。",
    "bodyHTML": "\u003cp>如果团队已经在 Linear 或 Jira 规划工作，CI-02 的状态就可能同时出现在原任务和 GitHub 看板，接手者需要知道该更新哪一边。\u003c/p>\n\u003cp>\u003cstrong>让团队已有的任务系统负责状态更新，用 GitHub PR 和 Actions 保存可回查的代码与验证证据。\u003c/strong>\u003c/p>\n\u003cp>对 WhyJ-Quant，GitHub Projects 加仓库 Issues 已经能关联需求、PR 和项目字段。使用 Linear 或 Jira 的团队可以继续沿用所在系统的委派入口和更新权限。\u003c/p>\n\u003cdiv aria-label=\"附录 A · GitHub、Linear 和 Jira 的委派入口\" class=\"table-wrap\" role=\"region\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">入口\u003c/th>\n\u003cth scope=\"col\">适合怎样交办\u003c/th>\n\u003cth scope=\"col\">Agent 怎样接手\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>GitHub Projects + Issues\u003c/td>\n\u003ctd>维护者从看板选工作，把卡片或 Issue 链接交给 Agent。\u003c/td>\n\u003ctd>Agent 通过 CLI 或 API 回填。具备权限时，维护者可以\u003ca href=\"https://docs.github.com/en/copilot/how-tos/copilot-on-github/use-copilot-agents/kick-off-a-task\" rel=\"noopener noreferrer\" target=\"_blank\">将仓库 Issue 指派给 GitHub Copilot\u003c/a>，由它提交 PR 供评审。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Linear + GitHub\u003c/td>\n\u003ctd>负责人通过委派或 @ 提及发起工作。\u003c/td>\n\u003ctd>现有 Agent 可以用 \u003ca href=\"https://linear.app/docs/mcp\" rel=\"noopener noreferrer\" target=\"_blank\">Linear MCP\u003c/a>读写卡片。原生委派通过 \u003ca href=\"https://linear.app/developers/agent-interaction\" rel=\"noopener noreferrer\" target=\"_blank\">AgentSession 与 Activity\u003c/a>接收任务、报告进展，再通过 \u003ca href=\"https://linear.app/docs/github-integration\" rel=\"noopener noreferrer\" target=\"_blank\">Linear 的 GitHub 集成\u003c/a>关联 PR 和 Issue。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Jira + GitHub\u003c/td>\n\u003ctd>团队已经在 Jira 管理需求与跨团队依赖。\u003c/td>\n\u003ctd>团队可以\u003ca href=\"https://support.atlassian.com/jira-software-cloud/docs/generate-code-from-a-work-item-in-jira/\" rel=\"noopener noreferrer\" target=\"_blank\">从 Jira 工作项启动编码 Agent\u003c/a>，让它提交 Draft PR 供评审。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003ca href=\"https://linear.app/developers/agents\" rel=\"noopener noreferrer\" target=\"_blank\">Linear 的 Agent 委派设计\u003c/a>区分人的 assignee 和 Agent 的 delegate。我会把这个责任边界沿用到 GitHub。维护者继续负责需求与验收，Worker 会话负责推进当前尝试。会话结束或重试后，负责人与待验收内容还留在需求卡上。\u003c/p>\n"
  },
  {
    "id": "codex-review",
    "tocLabel": "附录 B · Codex 托管评审",
    "heading": "附录 B · 用自己的账号接入 Codex 托管评审",
    "body": "连接账号后，PR 上对 @codex review 的回应只能确认请求已收到。开启自动触发前，还需要看到一次完整的评审回执。 先用一条真实 PR 的手动评审验证仓库权限和回执，再开启自动评审。 用有 Code Review 权限的 ChatGPT 账号打开 Codex 的 Code Review 设置 ，连接 GitHub。GitHub 要求选择授权范围时，只选择目标仓库。配置自动评审需要对该仓库有写入或管理权限。 在一条真实 PR 下留言 @codex review 。看到 Codex 对评论作出反应后，继续等 PR 上出现由 Codex 发出的评审。反应表示收到了请求，评审回执才证明这次调用走完。 按 Codex 的 GitHub 评审指南 为目标仓库开启自动评审，并核对个人偏好的触发选项。仓库可在 AGENTS.md 的 Code Review Rules 段写下具体契约和容易漏掉的风险。 托管评审使用你授权的账号，可以在电脑关机时继续运行。需要在 CI 里控制提示词、模型或输出时，可用 openai/codex-action@v1 运行 Codex，把 OPENAI_API_KEY 存为 Actions Secret，再用 model 参数选择该 API 项目可用的模型。",
    "bodyHTML": "\u003cp>连接账号后，PR 上对 \u003ccode>@codex review\u003c/code> 的回应只能确认请求已收到。开启自动触发前，还需要看到一次完整的评审回执。\u003c/p>\n\u003cp>\u003cstrong>先用一条真实 PR 的手动评审验证仓库权限和回执，再开启自动评审。\u003c/strong>\u003c/p>\n\u003col>\n\u003cli>用有 Code Review 权限的 ChatGPT 账号打开 \u003ca href=\"https://chatgpt.com/settings/code-review\" rel=\"noopener noreferrer\" target=\"_blank\">Codex 的 Code Review 设置\u003c/a>，连接 GitHub。GitHub 要求选择授权范围时，只选择目标仓库。配置自动评审需要对该仓库有写入或管理权限。\u003c/li>\n\u003cli>在一条真实 PR 下留言 \u003ccode>@codex review\u003c/code>。看到 Codex 对评论作出反应后，继续等 PR 上出现由 Codex 发出的评审。反应表示收到了请求，评审回执才证明这次调用走完。\u003c/li>\n\u003cli>按 \u003ca href=\"https://learn.chatgpt.com/docs/third-party/github\" rel=\"noopener noreferrer\" target=\"_blank\">Codex 的 GitHub 评审指南\u003c/a>为目标仓库开启自动评审，并核对个人偏好的触发选项。仓库可在 \u003ccode>AGENTS.md\u003c/code> 的 \u003cstrong>Code Review Rules\u003c/strong> 段写下具体契约和容易漏掉的风险。\u003c/li>\n\u003c/ol>\n\u003cp>托管评审使用你授权的账号，可以在电脑关机时继续运行。需要在 CI 里控制提示词、模型或输出时，可用 \u003ca href=\"https://learn.chatgpt.com/docs/github-action\" rel=\"noopener noreferrer\" target=\"_blank\">\u003ccode>openai/codex-action@v1\u003c/code>\u003c/a>运行 Codex，把 \u003ccode>OPENAI_API_KEY\u003c/code> 存为 Actions Secret，再用 \u003ccode>model\u003c/code> 参数选择该 API 项目可用的模型。\u003c/p>\n"
  },
  {
    "id": "review-providers",
    "tocLabel": "附录 C · 多模型评审",
    "heading": "附录 C · 用 Actions 接入 Gemini、GLM、DeepSeek 和 Kimi",
    "body": "四种模型接到同一个 Actions 后，拿到模型 ID 或一条短响应只说明接入走通。要比较它们对 CI-02 这类变更的判断，还得让它们评同一个改动。 比较评审模型时，固定同一 PR、提交和评审指令，记录响应与耗时，再由维护者复核每条发现。 先用 GitHub Actions Secrets 为各服务保存凭据，服务地址和模型 ID 写在可信的 workflow 配置或仓库 Variables 里。评审任务根据预先定义的 provider 名称选用对应的地址、模型和 Secret。下表的模型 ID 是配置示例，运行前以账号可调用的模型为准。 模型 地址、模型 ID 与凭据 配置要点 Gemini Pro 在 Google AI Studio 创建项目密钥，存为 GEMINI_API_KEY 。示例模型 gemini-3.1-pro-preview 。 用 Gemini CLI Action 的 PR 评审示例 接入，通过 gemini_model 选模型。账号若能在 Google Developer Program 福利页 领取 Cloud 额度，先按 计费说明 核对 Gemini API 的抵扣条件。 智谱 GLM https://open.bigmodel.cn/api/paas/v4/ · glm-5.3 · ZAI_API_KEY 用智谱开放平台的通用 API Key 调用 智谱的 OpenAI 兼容接口 。 DeepSeek https://api.deepseek.com · deepseek-flash 或 deepseek-v4-pro · DEEPSEEK_API_KEY 按 DeepSeek 的模型与地址表 确认模型 ID。复用 GLM 的 Chat Completions 调用，替换地址、模型和密钥。 Kimi 多模型网关 使用供应商给出的 OpenAI 兼容 Base URL · 模型 ID 取自目录 · REVIEW_GATEWAY_API_KEY 多条路由可能指向同一模型系列。先调用 /models ，复制所选 Kimi 路由的完整 ID，再向 /chat/completions 发一条短请求。核对最终正文是否非空，并记录实际返回的模型和耗时。 如果你已有多模型网关，把 Base URL（包含网关要求的版本路径，例如 /v1 ）放入 REVIEW_BASE_URL ，把 Actions Secret 传给调用步骤的 REVIEW_API_KEY 。下面的命令只列出模型 ID。 curl -fsS \"$REVIEW_BASE_URL/models\" \\\n  -H \"Authorization: Bearer $REVIEW_API_KEY\" |\n  jq -r '.data[].id' 确认模型 ID 后，可以在同一步骤设置 REVIEW_MODEL 并发一条短请求。命令只输出最终正文。 jq -n --arg model \"$REVIEW_MODEL\" \\\n  '{model:$model,messages:[{role:\"user\",content:\"Reply with OK.\"}],max_tokens:1024}' |\n  curl -fsS --max-time 30 \"$REVIEW_BASE_URL/chat/completions\" \\\n    -H \"Authorization: Bearer $REVIEW_API_KEY\" \\\n    -H \"Content-Type: application/json\" --data-binary @- |\n  jq -er '.choices[0].message.content | select(type == \"string\" and length > 0)' 先用 GitHub Actions 的手动触发 选择 PR 编号和一个 provider。 workflow_dispatch 要求 workflow 文件存在于默认分支。第一次只把结果写进运行摘要，注明 head SHA、服务实际返回的模型标识和是否超时，供下一轮对照。目录接口成功后，还要照上面的短请求验证生成能交付可读正文。 等单次验收通过，再决定哪个模型负责自动评审。评审任务只读取 PR diff 和基线分支的评审规范。需要自动回帖时，单独给发布步骤所需的 PR 写权限。 GitHub Actions 的安全指南 解释了高权限作业执行不可信 PR 代码的风险。公开仓库应把这种代码执行与模型密钥隔开。WhyJ-Quant 的合入继续由 CI required 与 PR policy 执行确定性检查。 一次试跑。 我用 WhyJ-Quant PR #1007 的 workflow diff 试跑 Kimi。前几次请求超时，成功的短请求返回模型 kimi-k3 。它把「手动运行仅限 main 」和「自动运行需要显式打开」都报成问题。我用 可选 Live Provider 的 CI 指南 和需求复核后，把两条都记为误报。这个例子说明了怎样用项目契约复核一条评审意见，模型对比还需要更多固定样本。",
    "bodyHTML": "\u003cp>四种模型接到同一个 Actions 后，拿到模型 ID 或一条短响应只说明接入走通。要比较它们对 CI-02 这类变更的判断，还得让它们评同一个改动。\u003c/p>\n\u003cp>\u003cstrong>比较评审模型时，固定同一 PR、提交和评审指令，记录响应与耗时，再由维护者复核每条发现。\u003c/strong>\u003c/p>\n\u003cp>先用 \u003ca href=\"https://docs.github.com/en/actions/how-tos/write-workflows/choose-what-workflows-do/use-secrets\" rel=\"noopener noreferrer\" target=\"_blank\">GitHub Actions Secrets\u003c/a>为各服务保存凭据，服务地址和模型 ID 写在可信的 workflow 配置或仓库 Variables 里。评审任务根据预先定义的 provider 名称选用对应的地址、模型和 Secret。下表的模型 ID 是配置示例，运行前以账号可调用的模型为准。\u003c/p>\n\u003cdiv aria-label=\"附录 C · 用 Actions 接入 Gemini、GLM、DeepSeek 和 Kimi\" class=\"table-wrap\" role=\"region\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">模型\u003c/th>\n\u003cth scope=\"col\">地址、模型 ID 与凭据\u003c/th>\n\u003cth scope=\"col\">配置要点\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003cstrong>Gemini Pro\u003c/strong>\u003c/td>\n\u003ctd>在 \u003ca href=\"https://aistudio.google.com/api-keys\" rel=\"noopener noreferrer\" target=\"_blank\">Google AI Studio\u003c/a>创建项目密钥，存为 \u003ccode>GEMINI_API_KEY\u003c/code>。示例模型 \u003ccode>gemini-3.1-pro-preview\u003c/code>。\u003c/td>\n\u003ctd>用 \u003ca href=\"https://github.com/google-github-actions/run-gemini-cli/blob/main/examples/workflows/pr-review/README.md\" rel=\"noopener noreferrer\" target=\"_blank\">Gemini CLI Action 的 PR 评审示例\u003c/a>接入，通过 \u003ccode>gemini_model\u003c/code> 选模型。账号若能在 \u003ca href=\"https://me.developers.google.com/benefits\" rel=\"noopener noreferrer\" target=\"_blank\">Google Developer Program 福利页\u003c/a>领取 Cloud 额度，先按\u003ca href=\"https://developers.google.com/profile/help/faq?hl=en\" rel=\"noopener noreferrer\" target=\"_blank\">计费说明\u003c/a>核对 Gemini API 的抵扣条件。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>智谱 GLM\u003c/strong>\u003c/td>\n\u003ctd>\u003ccode>https://open.bigmodel.cn/api/paas/v4/\u003c/code> · \u003ccode>glm-5.3\u003c/code> · \u003ccode>ZAI_API_KEY\u003c/code>\u003c/td>\n\u003ctd>用智谱开放平台的通用 API Key 调用\u003ca href=\"https://docs.bigmodel.cn/cn/guide/develop/openai/introduction\" rel=\"noopener noreferrer\" target=\"_blank\">智谱的 OpenAI 兼容接口\u003c/a>。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>DeepSeek\u003c/strong>\u003c/td>\n\u003ctd>\u003ccode>https://api.deepseek.com\u003c/code> · \u003ccode>deepseek-flash\u003c/code> 或 \u003ccode>deepseek-v4-pro\u003c/code> · \u003ccode>DEEPSEEK_API_KEY\u003c/code>\u003c/td>\n\u003ctd>按 \u003ca href=\"https://api-docs.deepseek.com/quick_start/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">DeepSeek 的模型与地址表\u003c/a>确认模型 ID。复用 GLM 的 Chat Completions 调用，替换地址、模型和密钥。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Kimi 多模型网关\u003c/strong>\u003c/td>\n\u003ctd>使用供应商给出的 OpenAI 兼容 Base URL · 模型 ID 取自目录 · \u003ccode>REVIEW_GATEWAY_API_KEY\u003c/code>\u003c/td>\n\u003ctd>多条路由可能指向同一模型系列。先调用 \u003ccode>/models\u003c/code>，复制所选 Kimi 路由的完整 ID，再向 \u003ccode>/chat/completions\u003c/code> 发一条短请求。核对最终正文是否非空，并记录实际返回的模型和耗时。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>如果你已有多模型网关，把 Base URL（包含网关要求的版本路径，例如 \u003ccode>/v1\u003c/code>）放入 \u003ccode>REVIEW_BASE_URL\u003c/code>，把 Actions Secret 传给调用步骤的 \u003ccode>REVIEW_API_KEY\u003c/code>。下面的命令只列出模型 ID。\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">curl -fsS \"$REVIEW_BASE_URL/models\" \\\n  -H \"Authorization: Bearer $REVIEW_API_KEY\" |\n  jq -r '.data[].id'\n\u003c/code>\u003c/pre>\n\u003cp>确认模型 ID 后，可以在同一步骤设置 \u003ccode>REVIEW_MODEL\u003c/code> 并发一条短请求。命令只输出最终正文。\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">jq -n --arg model \"$REVIEW_MODEL\" \\\n  '{model:$model,messages:[{role:\"user\",content:\"Reply with OK.\"}],max_tokens:1024}' |\n  curl -fsS --max-time 30 \"$REVIEW_BASE_URL/chat/completions\" \\\n    -H \"Authorization: Bearer $REVIEW_API_KEY\" \\\n    -H \"Content-Type: application/json\" --data-binary @- |\n  jq -er '.choices[0].message.content | select(type == \"string\" and length &gt; 0)'\n\u003c/code>\u003c/pre>\n\u003cp>先用 \u003ca href=\"https://docs.github.com/en/actions/how-tos/manage-workflow-runs/manually-run-a-workflow\" rel=\"noopener noreferrer\" target=\"_blank\">GitHub Actions 的手动触发\u003c/a>选择 PR 编号和一个 provider。\u003ccode>workflow_dispatch\u003c/code> 要求 workflow 文件存在于默认分支。第一次只把结果写进运行摘要，注明 head SHA、服务实际返回的模型标识和是否超时，供下一轮对照。目录接口成功后，还要照上面的短请求验证生成能交付可读正文。\u003c/p>\n\u003cp>等单次验收通过，再决定哪个模型负责自动评审。评审任务只读取 PR diff 和基线分支的评审规范。需要自动回帖时，单独给发布步骤所需的 PR 写权限。\u003ca href=\"https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions\" rel=\"noopener noreferrer\" target=\"_blank\">GitHub Actions 的安全指南\u003c/a>解释了高权限作业执行不可信 PR 代码的风险。公开仓库应把这种代码执行与模型密钥隔开。WhyJ-Quant 的合入继续由 \u003ccode>CI required\u003c/code> 与 \u003ccode>PR policy\u003c/code> 执行确定性检查。\u003c/p>\n\u003cp>\u003cstrong>一次试跑。\u003c/strong> 我用 \u003ca href=\"https://github.com/yangjingo/WhyJ-Quant/pull/1007\" rel=\"noopener noreferrer\" target=\"_blank\">WhyJ-Quant PR #1007\u003c/a>的 workflow diff 试跑 Kimi。前几次请求超时，成功的短请求返回模型 \u003ccode>kimi-k3\u003c/code>。它把「手动运行仅限 \u003ccode>main\u003c/code>」和「自动运行需要显式打开」都报成问题。我用\u003ca href=\"https://github.com/yangjingo/WhyJ-Quant/blob/08f860beeb8d3a3b9bf0eae15b7c9ebcde75fdb5/docs/ci-release.md#optional-live-provider-evaluation\" rel=\"noopener noreferrer\" target=\"_blank\">可选 Live Provider 的 CI 指南\u003c/a>和需求复核后，把两条都记为误报。这个例子说明了怎样用项目契约复核一条评审意见，模型对比还需要更多固定样本。\u003c/p>\n"
  }
];

// ═══════════════════════════════════════
// ③ 排版
// ═══════════════════════════════════════
var SERIF = "'Noto Serif SC', 'Songti SC', 'SimSun', Georgia, serif";
var SANS = "'Inter', 'Microsoft YaHei', 'Segoe UI', sans-serif";

// 标题自适应：二分搜索最大字号，限制在 maxLines 行内
function fitTitle(text, maxWidth, maxLines) {
  var lo = 24, hi = 56, best = lo;
  var minTitle = prepareWithSegments(text, '700 ' + lo + 'px ' + SERIF);
  var bestLines = layoutWithLines(minTitle, maxWidth, Math.round(lo * 1.15)).lines;
  while (lo <= hi) {
    var size = Math.floor((lo + hi) / 2);
    var font = '700 ' + size + 'px ' + SERIF;
    var lh = Math.round(size * 1.15);
    var p = prepareWithSegments(text, font);
    var result = layoutWithLines(p, maxWidth, lh);
    if (result.lineCount <= maxLines) {
      best = size;
      bestLines = result.lines;
      lo = size + 1;
    } else {
      hi = size - 1;
    }
  }
  return { size: best, lineHeight: Math.round(best * 1.15), lines: bestLines };
}

// ═══════════════════════════════════════
// ④ 渲染
// ═══════════════════════════════════════
var titleWrap = document.getElementById('title-wrap');
var leadWrap = document.getElementById('lead-wrap');
var sectionsWrap = document.getElementById('sections-wrap');



// Resolve chapter IDs once so the navigation survives a layout re-render.
const reservedSectionIds = new Set(SECTIONS.map(section => section.id).filter(Boolean));
const sectionIds = SECTIONS.map((section, index) => {
  if (section.id) return section.id;
  if (!section.heading || section.diagram || section.image) return '';
  let id = 'section-' + (index + 1);
  while (reservedSectionIds.has(id)) id += '-heading';
  reservedSectionIds.add(id);
  return id;
});

function figureZoom(figure, trigger) {
  const label = figure.lang === 'en' || document.documentElement.lang.startsWith('en')
    ? ['Zoom figure', 'Close figure']
    : ['放大图片', '关闭图片'];
  const description = trigger.getAttribute('aria-label') ||
    trigger.querySelector('[aria-label]')?.getAttribute('aria-label') || trigger.alt || '';

  function toggle(visible) {
    figure.classList.toggle('zoomed', visible);
    trigger.setAttribute('aria-expanded', String(visible));
    trigger.setAttribute('aria-label', [label[Number(visible)], description].filter(Boolean).join(' · '));
  }

  trigger.classList.add('figure-zoom-target');
  trigger.tabIndex = 0;
  trigger.setAttribute('role', 'button');
  toggle(false);
  trigger.addEventListener('click', event => {
    const selection = window.getSelection();
    if (event.target.closest('a, button, input, select, textarea, summary') ||
        (selection && !selection.isCollapsed && trigger.contains(selection.anchorNode))) return;
    event.stopPropagation();
    document.querySelectorAll('.figure-block.zoomed').forEach(other => {
      if (other !== figure) other.dispatchEvent(new Event('close-figure'));
    });
    toggle(!figure.classList.contains('zoomed'));
  });
  trigger.addEventListener('keydown', event => {
    if (event.target === trigger && (event.key === 'Enter' || event.key === ' ')) {
      event.preventDefault();
      window.getSelection()?.removeAllRanges();
      trigger.click();
    }
  });
  figure.addEventListener('close-figure', () => toggle(false));
  figure.addEventListener('click', event => {
    if (event.target === figure) toggle(false);
  });
}
document.addEventListener('keydown', event => {
  if (event.key === 'Escape') {
    document.querySelectorAll('.figure-block.zoomed').forEach(figure => figure.dispatchEvent(new Event('close-figure')));
  }
});

function render() {
  var pageW = titleWrap.clientWidth;

  // ---- Title: pretext 自适应字号 ----
  var title = fitTitle(TITLE, pageW, 3);
  titleWrap.innerHTML = '';
  for (var i = 0; i < title.lines.length; i++) {
    var el = document.createElement('span');
    el.className = 'title-line';
    el.setAttribute('aria-hidden', 'true');
    el.textContent = title.lines[i].text;
    el.style.fontSize = title.size + 'px';
    el.style.lineHeight = title.lineHeight + 'px';
    titleWrap.appendChild(el);
  }

  // ---- Lead: pretext 测量行数，CSS 正常渲染 ----
  var leadFont = '500 15.5px ' + SANS;
  var leadLH = 26;
  var leadP = prepareWithSegments(LEAD, leadFont);
  var leadResult = layoutWithLines(leadP, pageW, leadLH);

  leadWrap.innerHTML = '';
  leadWrap.className = 'lead-block';
  leadWrap.textContent = LEAD;
  // 用 pretext 测量的行数设置精确高度，避免 CLS
  leadWrap.style.minHeight = leadResult.lineCount * leadLH + 'px';

  // ---- Sections: pretext 测量，CSS 渲染 ----
  sectionsWrap.innerHTML = '';

  for (var si = 0; si < SECTIONS.length; si++) {
    var s = SECTIONS[si];

    // figure section
    if (s.diagram || s.image) {
      var figSec = document.createElement('div');
      figSec.className = 'section';
      if (s.id) figSec.id = s.id;
      var figBlock = document.createElement('figure');
      figBlock.className = 'figure-block';
      var zoomTarget;
      if (s.diagram) {
        figBlock.setAttribute('data-native', '');
        zoomTarget = document.createElement('div');
        zoomTarget.className = 'figure-content';
        zoomTarget.innerHTML = s.diagram;
        figBlock.appendChild(zoomTarget);
      } else {
        var img = document.createElement('img');
        img.src = s.image;
        img.alt = s.alt || s.description || s.caption || '';
        (function(block, imgEl, promptText, captionText) {
          imgEl.onerror = function() {
            imgEl.style.display = 'none';
            var ph = document.createElement('div');
            ph.className = 'figure-placeholder';
            ph.innerHTML = '<div class="figure-placeholder-icon">&#9634;</div>' +
              '<div class="figure-placeholder-label">待生成插图</div>' +
              (promptText ? '<div class="figure-placeholder-prompt">' + promptText.replace(/</g,'&lt;') + '</div>' : '');
            block.insertBefore(ph, block.firstChild);
          };
        })(figBlock, img, s.prompt, s.caption);
        figBlock.appendChild(img);
        zoomTarget = img;
      }
      if (s.caption) {
        const caption = document.createElement('figcaption');
        caption.className = 'figure-caption';
        const title = document.createElement('strong');
        title.lang = 'en';
        title.textContent = s.caption;
        caption.appendChild(title);
        if (s.description || s.source) {
          const detail = document.createElement('p');
          detail.textContent = s.description || '';
          if (s.source) {
            if (s.description) detail.append(' ');
            const source = document.createElement('a');
            source.href = s.source;
            source.textContent = s.sourceLabel || 'Source';
            detail.appendChild(source);
          }
          caption.appendChild(detail);
        }
        figBlock.appendChild(caption);
      }
      if (s.prompt) {
        var promptEl = document.createElement('div');
        promptEl.className = 'figure-prompt-vis';
        promptEl.textContent = s.prompt;
        figBlock.appendChild(promptEl);
        figBlock.setAttribute('data-prompt', s.prompt);
      }
      figSec.appendChild(figBlock);
      sectionsWrap.appendChild(figSec);
      figureZoom(figBlock, zoomTarget);
      continue;
    }

    var sec = document.createElement('div');
    sec.className = 'section';
    if (sectionIds[si]) sec.id = sectionIds[si];
    if (s.heading) sec.tabIndex = -1;

    if (s.heading) {
      var hEl = document.createElement('h2');
      hEl.className = 'section-h';
      hEl.textContent = s.heading;
      sec.appendChild(hEl);
    } else {
      sec.classList.add('section-continuation');
    }

    // callout (if any)
    if (s.callout) {
      var cEl = document.createElement('div');
      cEl.className = 'callout';
      cEl.textContent = s.callout;
      sec.appendChild(cEl);
    }

    // body
    var bEl = document.createElement('div');
    bEl.className = 'section-body';
    if (s.bodyHTML) {
      bEl.innerHTML = s.bodyHTML;
    } else {
      bEl.textContent = s.body;
      var bFont = '400 17px ' + SERIF;
      var bP = prepareWithSegments(s.body, bFont);
      var bResult = layoutWithLines(bP, pageW, 30);
      bEl.style.height = bResult.lineCount * 30 + 'px';
    }
    sec.appendChild(bEl);

    sectionsWrap.appendChild(sec);
  }
}

function initArticleToc() {
  const nav = document.querySelector('.article-toc');
  const list = nav.querySelector('.toc-list');
  const toggle = nav.querySelector('.toc-toggle');
  const preview = nav.querySelector('.toc-preview');
  const label = document.documentElement.lang.toLowerCase().startsWith('en') ? 'Contents' : '目录';
  nav.setAttribute('aria-label', label);
  nav.querySelector('.toc-heading').textContent = label;
  nav.querySelector('.toc-toggle-label').textContent = label;

  const chapters = new Map();
  SECTIONS.forEach((section, index) => {
    if (!section.heading || section.diagram || section.image) return;
    const id = sectionIds[index];
    const link = document.createElement('a');
    link.href = '#' + encodeURIComponent(id);
    link.textContent = section.tocLabel || section.heading;
    const item = document.createElement('li');
    if (section.tocBreak && chapters.size) item.className = 'toc-break';
    item.append(link);
    list.append(item);
    chapters.set(id, link);
  });
  if (!chapters.size) return;
  nav.hidden = false;

  let activeLink;
  let frame = 0;
  let fragmentScrollY;

  function setCurrent(link) {
    if (activeLink === link) return;
    activeLink?.removeAttribute('aria-current');
    activeLink = link;
    link.setAttribute('aria-current', 'location');
    preview.textContent = link.textContent;
    if (list.clientHeight && list.scrollHeight > list.clientHeight) {
      const bounds = list.getBoundingClientRect();
      const target = link.getBoundingClientRect();
      if (target.top < bounds.top) list.scrollTop += target.top - bounds.top;
      if (target.bottom > bounds.bottom) list.scrollTop += target.bottom - bounds.bottom;
    }
  }

  function updateCurrent() {
    frame = 0;
    // A short article can keep the selected heading below the reading line.
    if (fragmentScrollY === window.scrollY) return;
    fragmentScrollY = undefined;
    const readingLine = Math.min(148, Math.max(88, window.innerHeight * 0.22));
    let current = chapters.values().next().value;
    for (const [id, link] of chapters) {
      const section = document.getElementById(id);
      if (section && section.getBoundingClientRect().top > readingLine) break;
      current = link;
    }
    setCurrent(current);
  }

  function selectFragment() {
    for (const [id, link] of chapters) {
      if (link.hash !== location.hash) continue;
      document.getElementById(id)?.scrollIntoView();
      fragmentScrollY = window.scrollY;
      setCurrent(link);
      return true;
    }
    return false;
  }

  toggle.addEventListener('click', () => {
    toggle.setAttribute('aria-expanded', String(toggle.getAttribute('aria-expanded') !== 'true'));
  });
  list.addEventListener('click', event => {
    const link = event.target.closest('a');
    if (!link || event.button !== 0 || event.metaKey || event.ctrlKey || event.altKey || event.shiftKey) return;
    toggle.setAttribute('aria-expanded', 'false');
    setCurrent(link);
    if (link.hash === location.hash) requestAnimationFrame(selectFragment);
  });
  nav.addEventListener('keydown', event => {
    if (event.key !== 'Escape' || toggle.getAttribute('aria-expanded') !== 'true') return;
    toggle.setAttribute('aria-expanded', 'false');
    toggle.focus();
  });
  window.addEventListener('scroll', () => {
    if (!frame) frame = requestAnimationFrame(updateCurrent);
  }, { passive: true });
  window.addEventListener('hashchange', () => {
    if (!selectFragment()) updateCurrent();
  });
  if (!selectFragment()) updateCurrent();
}

// ═══════════════════════════════════════
// ⑤ 启动
// ═══════════════════════════════════════
document.title = TITLE;
document.getElementById('article-meta').textContent = META;
await document.fonts.ready;
render();
initArticleToc();

var resizeTimer = 0;
window.addEventListener('resize', function() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(render, 100);
});

// A brief ripple acknowledges a click on the reading surface.
{
  const ripple = document.getElementById('reading-ripple');
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const interactive = 'a, button, input, select, textarea, label, summary, [role="button"], [contenteditable], .figure-block';
  let animation;

  document.addEventListener('click', (event) => {
    if (reducedMotion.matches || !event.detail || event.defaultPrevented ||
        event.target.closest(interactive) || getSelection()?.isCollapsed === false) return;

    animation?.cancel();
    ripple.style.left = event.clientX + 'px';
    ripple.style.top = event.clientY + 'px';
    ripple.hidden = false;
    const current = ripple.animate([
      { transform: 'translate(-50%, -50%) scale(.18)', opacity: .88 },
      { transform: 'translate(-50%, -50%) scale(.63)', opacity: .68, offset: .36 },
      { transform: 'translate(-50%, -50%) scale(1.08)', opacity: 0 },
    ], { duration: 560, easing: 'cubic-bezier(.17, .65, .32, 1)' });
    animation = current;
    current.onfinish = () => {
      if (animation === current) ripple.hidden = true;
    };
  });
}
</script>
