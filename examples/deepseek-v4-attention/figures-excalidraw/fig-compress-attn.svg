<text x="400" y="27" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="17" fill="#4A4540" text-anchor="middle">KV Compression Strategies</text>
<text x="200" y="58" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="13" fill="#4A4540" text-anchor="middle">(a) Mean Pooling — No Parameters</text>
<text x="108.5" y="90" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="9" fill="#4A4540" text-anchor="start">Input group (ratio=4)</text>
<text x="129.5" y="112" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">t1</text>
<text x="176.5" y="112" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">t2</text>
<text x="223.5" y="112" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">t3</text>
<text x="270.5" y="112" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">t4</text>
<text x="200" y="175" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="11" fill="#4A4540" text-anchor="middle">mean(t1, t2, t3, t4)</text>
<text x="200" y="234" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="12" fill="#4A4540" text-anchor="middle">cKV</text>
<text x="200" y="292" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">equal weights · cannot learn importance</text>
<text x="200" y="305" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">no trainable parameters</text>
<text x="600" y="58" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="13" fill="#4A4540" text-anchor="middle">(b) w_compress — Learned (V4)</text>
<text x="508.5" y="90" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="9" fill="#4A4540" text-anchor="start">Input group (ratio=4)</text>
<text x="529.5" y="112" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">t1</text>
<text x="576.5" y="112" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">t2</text>
<text x="623.5" y="112" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">t3</text>
<text x="670.5" y="112" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">t4</text>
<text x="600" y="169" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">w_compress: Linear(4→1)</text>
<text x="600" y="182" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">n.Linear(ratio, 1, bias=False)</text>
<text x="600" y="244" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="12" fill="#4A4540" text-anchor="middle">cKV</text>
<text x="600" y="302" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">learnable weights · highlights important tokens</text>
<text x="600" y="315" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">end-to-end trained · overlap for boundaries</text>
<text x="160" y="377" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="9" fill="#4A4540" text-anchor="middle">raw token KV</text>
<text x="307" y="377" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="9" fill="#4A4540" text-anchor="middle">compressed KV</text>
<text x="479" y="377" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="9" fill="#4A4540" text-anchor="middle">compression method</text>
<text x="636" y="377" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="9" fill="#4A4540" text-anchor="middle">limitation (mean)</text>

