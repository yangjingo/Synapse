<text x="440" y="21" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="16" fill="#4A4540" text-anchor="middle">MQA vs MLA: Grouped Output Projection</text>
<text x="440" y="34" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#908A84" text-anchor="middle">Traditional: Wo [32x32] = 1024 params | V4-MQA: grouped Wo = 384 params (2.7x fewer)</text>
<text x="230" y="61" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="13" fill="#4A4540" text-anchor="middle">(a) Traditional MQA</text>
<text x="230" y="74" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#908A84" text-anchor="middle">Z [n_heads=4, head_dim=8] = [32]</text>
<text x="117.5" y="108" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="12" fill="#4A4540" text-anchor="middle">h1</text>
<text x="192.5" y="108" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="12" fill="#4A4540" text-anchor="middle">h2</text>
<text x="267.5" y="108" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="12" fill="#4A4540" text-anchor="middle">h3</text>
<text x="342.5" y="108" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="12" fill="#4A4540" text-anchor="middle">h4</text>
<text x="230" y="163" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="11" fill="#4A4540" text-anchor="middle">concat [32]</text>
<text x="230" y="218" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="13" fill="#4A4540" text-anchor="middle">Wo [32 x 32]</text>
<text x="230" y="275" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="13" fill="#4A4540" text-anchor="middle">O [32]</text>
<text x="230" y="306" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="11" fill="#908A84" text-anchor="middle">params: 32 x 32 = 1024</text>
<text x="650" y="61" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="13" fill="#4A4540" text-anchor="middle">(b) V4-MQA</text>
<text x="650" y="74" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#908A84" text-anchor="middle">Z [n_heads=4, head_dim=8] = [32]</text>
<text x="537.5" y="108" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="12" fill="#4A4540" text-anchor="middle">h1</text>
<text x="612.5" y="108" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="12" fill="#4A4540" text-anchor="middle">h2</text>
<text x="687.5" y="108" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="12" fill="#4A4540" text-anchor="middle">h3</text>
<text x="762.5" y="108" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="12" fill="#4A4540" text-anchor="middle">h4</text>
<text x="575" y="128" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="9" fill="#887E9A" text-anchor="middle">group1 [16d]</text>
<text x="725" y="128" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="9" fill="#8088A0" text-anchor="middle">group2 [16d]</text>
<text x="575" y="155" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">Wo_Lora1 [16x4]</text>
<text x="725" y="155" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">Wo_Lora2 [16x4]</text>
<text x="575" y="208" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="11" fill="#4A4540" text-anchor="middle">r1 [4]</text>
<text x="725" y="208" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="11" fill="#4A4540" text-anchor="middle">r2 [4]</text>
<text x="650" y="263" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">concat [r1, r2] = [8]</text>
<text x="650" y="317" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="13" fill="#4A4540" text-anchor="middle">Wo [8 -&gt; 32]</text>
<text x="650" y="348" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#908A84" text-anchor="middle">params: 2x(16x4) + 8x32 = 384</text>
<text x="650" y="367" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="11" fill="#887E9A" text-anchor="middle">2.7x fewer</text>
<text x="145" y="399" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="9" fill="#4A4540" text-anchor="middle">Traditional heads</text>
<text x="270" y="399" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="9" fill="#4A4540" text-anchor="middle">group 1</text>
<text x="370" y="399" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="9" fill="#4A4540" text-anchor="middle">group 2</text>
<text x="485" y="399" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="9" fill="#4A4540" text-anchor="middle">Wo projection</text>

