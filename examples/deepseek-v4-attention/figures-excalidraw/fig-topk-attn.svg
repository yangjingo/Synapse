<text x="400" y="27" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="17" fill="#4A4540" text-anchor="middle">Post-Selection vs Pre-Selection (Indexer)</text>
<text x="200" y="58" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="13" fill="#4A4540" text-anchor="middle">(a) Post-Selection — score then drop</text>
<text x="130" y="96" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="11" fill="#4A4540" text-anchor="middle">KV [L × d]</text>
<text x="270" y="96" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="11" fill="#4A4540" text-anchor="middle">Q [1 × d]</text>
<text x="200" y="158" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="11" fill="#4A4540" text-anchor="middle">Full Attention Q×Kᵀ</text>
<text x="200" y="188" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#9A7E7E" text-anchor="middle">compute all L scores · O(L·d)</text>
<text x="80" y="238" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="start">scores</text>
<text x="98" y="261" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">k1</text>
<text x="132" y="261" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">k2</text>
<text x="166" y="261" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">k3</text>
<text x="200" y="261" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">k4</text>
<text x="234" y="261" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">k5</text>
<text x="268" y="261" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">k6</text>
<text x="302" y="261" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">k7</text>
<text x="200" y="316" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">top-k filter → keep [k2, k5]</text>
<text x="200" y="371" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="12" fill="#4A4540" text-anchor="middle">Attention (k2, k5)</text>
<text x="200" y="417" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">5 of 7 scores wasted · O(L·d)</text>
<text x="600" y="58" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="13" fill="#4A4540" text-anchor="middle">(b) Pre-Selection — Indexer picks first</text>
<text x="530" y="96" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="11" fill="#4A4540" text-anchor="middle">KV [L × d]</text>
<text x="670" y="96" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="11" fill="#4A4540" text-anchor="middle">Q [1 × d]</text>
<text x="600" y="158" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="11" fill="#4A4540" text-anchor="middle">Indexer (lightweight)</text>
<text x="600" y="188" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#887E9A" text-anchor="middle">Q·Wq + K·Wk → top-k idx · O(L·1)</text>
<text x="480" y="238" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="start">idx</text>
<text x="566" y="261" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">KV[k2]</text>
<text x="634" y="261" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">KV[k5]</text>
<text x="600" y="316" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">gather selected KV (k=2)</text>
<text x="600" y="371" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="12" fill="#4A4540" text-anchor="middle">Attention (k2, k5)</text>
<text x="600" y="417" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">no wasted scores · O(L·1) + O(k·d)</text>
<text x="145" y="456" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="9" fill="#4A4540" text-anchor="middle">Query / KV</text>
<text x="274" y="456" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="9" fill="#4A4540" text-anchor="middle">selected (top-k)</text>
<text x="423" y="456" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="9" fill="#4A4540" text-anchor="middle">wasted compute (post)</text>
<text x="572" y="456" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="9" fill="#4A4540" text-anchor="middle">saved compute (pre)</text>

<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#4A4540" /></marker></defs>
