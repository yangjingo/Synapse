<path d="M 400 55 L 400 305" fill="none" stroke="#908A84" stroke-width="1" />
<text x="400" y="27" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="17" fill="#4A4540" text-anchor="middle">Token-Wise vs Block-Wise KV Access</text>
<text x="200" y="58" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="13" fill="#4A4540" text-anchor="middle">(a) Token-Wise Sliding Window</text>
<text x="42" y="77" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#908A84" text-anchor="middle">KV:</text>
<text x="60" y="98" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">1</text>
<text x="100" y="98" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">2</text>
<text x="140" y="98" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">3</text>
<text x="180" y="98" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">4</text>
<text x="220" y="98" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">5</text>
<text x="260" y="98" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">6</text>
<text x="300" y="98" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">7</text>
<text x="340" y="98" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">8</text>
<text x="-10" y="153" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="9" fill="#4A4540" text-anchor="middle">q3 [2,3,4]</text>
<text x="100" y="153" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">2</text>
<text x="140" y="153" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">3</text>
<text x="180" y="153" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">4</text>
<text x="-10" y="191" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="9" fill="#4A4540" text-anchor="middle">q4 [3,4,5]</text>
<text x="140" y="191" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">3</text>
<text x="180" y="191" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">4</text>
<text x="220" y="191" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">5</text>
<text x="200" y="243" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">overlap: 3, 4</text>
<text x="200" y="276" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="11" fill="#9A7E7E" text-anchor="middle">KV 3, 4 loaded twice</text>
<text x="200" y="293" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#908A84" text-anchor="middle">each query = 1 independent HBM load</text>
<text x="200" y="329" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">4 queries → 4 separate window loads</text>
<text x="600" y="58" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="13" fill="#4A4540" text-anchor="middle">(b) Block-Wise Attention</text>
<text x="600" y="77" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#908A84" text-anchor="middle">KV blocks:</text>
<text x="459" y="100" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="9" fill="#4A4540" text-anchor="middle">Block A [1-4]</text>
<text x="553" y="100" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="9" fill="#4A4540" text-anchor="middle">Block B [5-8]</text>
<text x="647" y="100" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="9" fill="#4A4540" text-anchor="middle">Block C [9-12]</text>
<text x="741" y="100" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="9" fill="#4A4540" text-anchor="middle">Block D [13-16]</text>
<text x="459" y="128" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="9" fill="#7A9188" text-anchor="middle">loaded</text>
<text x="553" y="128" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="9" fill="#7A9188" text-anchor="middle">loaded</text>
<text x="647" y="128" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="9" fill="#908A84" text-anchor="middle">skipped</text>
<text x="741" y="128" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="9" fill="#908A84" text-anchor="middle">skipped</text>
<text x="600" y="172" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="11" fill="#4A4540" text-anchor="middle">Q block [q5, q6, q7, q8]</text>
<text x="600" y="276" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="11" fill="#7E9A84" text-anchor="middle">1 HBM load per block → 4 queries share</text>
<text x="600" y="293" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#908A84" text-anchor="middle">Block C, D outside window → skipped</text>
<text x="600" y="329" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">4 blocks → 2 loaded, 2 skipped → 2× fewer loads</text>
<text x="180" y="377" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="9" fill="#4A4540" text-anchor="middle">loaded KV / window</text>
<text x="332" y="377" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="9" fill="#4A4540" text-anchor="middle">skipped / unused</text>
<text x="454" y="377" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="9" fill="#4A4540" text-anchor="middle">Q query</text>
<text x="591" y="377" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="9" fill="#4A4540" text-anchor="middle">redundant overlap</text>
</svg>