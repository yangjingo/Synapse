<text x="512" y="129" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="9" fill="#4A4540" text-anchor="middle">X[2]</text>
<text x="584" y="129" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="9" fill="#4A4540" text-anchor="middle">X[3]</text>
