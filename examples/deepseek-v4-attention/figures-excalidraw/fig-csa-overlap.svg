<text x="660" y="129" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="9" fill="#4A4540" text-anchor="middle">X[3]</text>
<text x="732" y="129" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="9" fill="#4A4540" text-anchor="middle">X[4]</text>
<text x="400" y="162" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#908A84" text-anchor="middle">prev (D) | self (D)</text>
<text x="195" y="197" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="9" fill="#4A4540" text-anchor="middle">prev feature (X[t-1])</text>
<text x="350" y="197" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="9" fill="#4A4540" text-anchor="middle">self feature (X[t])</text>
<text x="480" y="197" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="9" fill="#4A4540" text-anchor="middle">zero padding</text>

