<text x="400" y="22" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="17" fill="#4A4540" text-anchor="middle">Overlap: Pair Each Token With Its Left Neighbor</text>
<text x="400" y="36" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#A8A29C" text-anchor="middle">X_ = [X[t-1] | X[t]] — output dim = 2D — X[-1] padded with zeros</text>
<text x="110" y="50" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#6A6560" text-anchor="middle">Input X:</text>
<text x="104" y="74" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">X[0]</text>
<text x="252" y="74" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">X[1]</text>
<text x="400" y="74" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">X[2]</text>
<text x="548" y="74" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">X[3]</text>
<text x="696" y="74" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#4A4540" text-anchor="middle">X[4]</text>
<text x="110" y="104" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="10" fill="#6A6560" text-anchor="middle">Output X_:</text>
<text x="44" y="128" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="13" fill="#4A4540" text-anchor="start"></text>
<text x="68" y="129" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="9" fill="#4A4540" text-anchor="middle">0</text>
<text x="140" y="129" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="9" fill="#4A4540" text-anchor="middle">X[0]</text>
<text x="192" y="128" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="13" fill="#4A4540" text-anchor="start"></text>
<text x="216" y="129" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="9" fill="#4A4540" text-anchor="middle">X[0]</text>
<text x="288" y="129" font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="9" fill="#4A4540" text-anchor="middle">X[1]</text>
